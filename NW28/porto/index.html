<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NW28 ID - Portofolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS RESET & GLOBAL STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #f3f4f6;
        }

        /* CONTAINER PDF & PEMBUNGKUS RESPONSIF */
        .pdf-container {
            width: 100%;
            height: 100dvh; /* Dynamic Viewport Height untuk HP */
            position: relative;
            background-color: #323639;
        }

        /* PENUTUP TOMBOL POP-OUT GOOGLE */
        .cover-button {
            position: absolute;
            top: 0;
            right: 0;
            width: 60px;
            height: 55px;
            background-color: #323639; /* Warna senada dengan header Google Viewer */
            z-index: 10;
        }

        .pdf-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* FLOATING BUBBLE BUTTON */
        .floating-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #25D366, #1da851);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }

        .floating-btn:hover {
            transform: scale(1.1) translateY(-5px);
        }

        .chat-icon {
            width: 32px;
            height: 32px;
            fill: white;
        }

        /* MODAL POPUP FORM */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 35px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 28px;
            color: #9ca3af;
            cursor: pointer;
            line-height: 1;
        }

        .modal-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            font-size: 26px;
            color: #111827;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .modal-header p {
            font-size: 14px;
            color: #6b7280;
            margin-top: 5px;
        }

        /* FORM STYLES */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #f3f4f6;
            border-radius: 12px;
            font-size: 16px; /* Mencegah auto-zoom di iPhone */
            background-color: #f9fafb;
            transition: all 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #25D366;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 211, 102, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            background: #1f2937;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .submit-btn:disabled {
            background: #d1d5db;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="pdf-container">
        <div class="cover-button"></div>
        
        <iframe src="https://docs.google.com/gview?url=https://www.nw28.co.id/data/portofolio-nw28-id.pdf&embedded=true" title="Portofolio NW28 ID"></iframe>
    </div>

    <div class="floating-btn" id="openFormBtn">
        <svg class="chat-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2ZM20 16H5.17L4 17.17V4H20V16Z"/>
            <path d="M7 9H17V11H7V9Z"/>
            <path d="M7 13H14V15H7V13Z"/>
        </svg>
    </div>

    <div class="modal-overlay" id="formModal">
        <div class="modal-content">
            <span class="close-btn" id="closeFormBtn">&times;</span>
            
            <div class="modal-header">
                <h2>NW28 ID</h2>
                <p>Silakan isi data untuk konsultasi gratis</p>
            </div>

            <form id="contactForm">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" name="nama" placeholder="Nama Anda" required>
                </div>
                
                <div class="form-group">
                    <label>Kota Asal</label>
                    <input type="text" name="kota" placeholder="Contoh: Jakarta" required>
                </div>
                
                <div class="form-group">
                    <label>No. WhatsApp</label>
                    <input type="tel" name="whatsapp" placeholder="Contoh: 0813..." required>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Kirim & Chat WhatsApp</button>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById('formModal');
        const openBtn = document.getElementById('openFormBtn');
        const closeBtn = document.getElementById('closeFormBtn');
        const form = document.getElementById('contactForm');
        const submitBtn = document.getElementById('submitBtn');

        // URL Google Apps Script yang sudah kamu buat
        const scriptURL = 'https://script.google.com/macros/s/AKfycbz_L1DI0Nu2I579tdFcF5e1REoU5bbKoqHflzVOd2EhuApPocvKuFp0ut7ByMgcsF2p2w/exec';
        
        // Nomor WhatsApp tujuan NW28 ID
        const waNumber = '6281312364679'; 

        // Fungsi buka/tutup modal
        openBtn.addEventListener('click', () => modal.classList.add('active'));
        closeBtn.addEventListener('click', () => modal.classList.remove('active'));
        window.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });

        // Submit Logic
        form.addEventListener('submit', e => {
            e.preventDefault(); 
            
            submitBtn.innerHTML = "Mengirim Data...";
            submitBtn.disabled = true;

            const formData = new FormData(form);
            const namaInput = formData.get('nama');
            const kotaInput = formData.get('kota');

            // Kirim ke Google Sheets
            fetch(scriptURL, { method: 'POST', body: formData, mode: 'no-cors' })
                .then(() => {
                    // Berhasil: Alihkan ke WhatsApp
                    const waMessage = `Halo NW28 ID, saya ${namaInput} dari ${kotaInput}. Saya telah melihat portofolio Anda dan ingin berkonsultasi lebih lanjut.`;
                    const waURL = `https://api.whatsapp.com/send?phone=${waNumber}&text=${encodeURIComponent(waMessage)}`;
                    
                    form.reset();
                    submitBtn.innerHTML = "Kirim & Chat WhatsApp";
                    submitBtn.disabled = false;
                    modal.classList.remove('active');

                    window.location.href = waURL; 
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    alert("Maaf, terjadi kesalahan. Silakan coba lagi.");
                    submitBtn.innerHTML = "Kirim & Chat WhatsApp";
                    submitBtn.disabled = false;
                });
        });
    </script>
</body>
</html>
